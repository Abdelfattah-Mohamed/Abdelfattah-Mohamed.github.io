name: Daily stock research ideas

on:
  schedule:
    # Weekday mornings for US markets. Adjust the UTC hour for your timezone.
    - cron: "0 12 * * 1-5"
  workflow_dispatch:

jobs:
  recommend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate recommendations
        run: python3 daily_stock_recommendations.py --output daily-stock-recommendations.md
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}

      - name: Add report to job summary
        run: cat daily-stock-recommendations.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-stock-recommendations
          path: daily-stock-recommendations.md
